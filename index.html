<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#14213d;--mu:#667085;--ac:#2f55d4;--ac2:#e6ecfc;--in:#138a5b;--out:#c9372c;--bd:#dde3ec;--warn:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#eaf0ff;--mu:#93a0bd;--ac:#7b9bff;--ac2:#22305a;--in:#4cd39a;--out:#ff8a7c;--bd:#26314f;--warn:#3a3217}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#eaf0ff;--mu:#93a0bd;--ac:#7b9bff;--ac2:#22305a;--in:#4cd39a;--out:#ff8a7c;--bd:#26314f;--warn:#3a3217}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
#seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
#seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:7px 16px;border-radius:9px}
#seg button.on{background:var(--ac);color:#fff}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:4px}
header input{width:auto;margin:0;background:var(--card)}
button{font:inherit;cursor:pointer}
.hero{padding:18px 4px 6px}.hero small,.card small,.mu{color:var(--mu)}
.hero h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .card{margin:0}.row2 b{display:block;font-size:18px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li.t{border-top:1px solid var(--bd);margin-top:6px;padding-top:6px}
.in{color:var(--in)}.out{color:var(--out)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.p{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:600}
.g{background:var(--ac2);color:var(--ac);border:0;border-radius:11px;padding:10px 14px;font-weight:600;margin-top:6px}
.x{background:none;border:0;color:var(--mu);font-size:20px;line-height:1}
.warn{background:var(--warn)}
h3{margin:18px 0 4px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-weight:600;padding:10px 4px;border-radius:10px}
nav button.on{color:var(--ac);background:var(--ac2)}
#m{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#m[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sh h3{margin:0 0 6px}.sh label{display:block;margin-top:10px;color:var(--mu);font-size:13px}
.sh .row{display:flex;gap:8px;margin-top:16px}.sh .row button{flex:1}
button,.tap{position:relative;overflow:hidden;transition:transform .12s}
button:active{transform:scale(.94)}.tap:active{transform:scale(.98)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes dr{from{stroke-dasharray:0 100}}
@keyframes gw{from{width:0}}
#v>*{animation:fi .25s ease both}.sh{animation:up .28s cubic-bezier(.2,.9,.3,1)}#m{animation:fi .2s}
circle.sl{animation:dr .7s ease-out}.bar i{animation:gw .7s ease-out}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:7px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:800;flex:none}
.bar{height:8px;background:var(--ac2);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
nav button{font-size:11.5px;padding:10px 2px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:9;animation:up .3s}
label.mu{display:block;margin-top:10px;font-size:13px}label.card input{margin-top:2px}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding:10px 12px;white-space:nowrap}
.card.warn.li{padding:8px 12px;margin:6px 0;animation:fi .25s}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));animation:up .2s}
#kp[hidden]{display:none}#kpv{font-size:20px;padding:4px 6px;display:block}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kg button{padding:12px 0;font-size:18px;font-weight:600;border-radius:10px;border:0;background:var(--bg);color:var(--tx)}
.kg .ko{background:var(--ac2);color:var(--ac)}.kg .kok{background:var(--ac);color:#fff}
body.kp main{padding-bottom:340px}body.kp .sh{padding-bottom:320px}
</style>
</head>
<body>
<main>
<header><div class="li" style="gap:4px;justify-content:flex-start"><button class="x" id="bk" onclick="back()" aria-label="Kembali" hidden>←</button><b id="ttl" style="font-size:18px"></b></div><input type="month" id="ym" onchange="S.ym=this.value;save();render()"></header>
<div class="li" style="margin:-2px 2px 8px"><small id="st" class="mu"></small><button class="x" style="font-size:14px" onclick="settings()">⚙ Sinkronisasi</button></div>
<div id="v"></div>
<div style="text-align:center;margin:14px 0"><button class="x" id="vb" style="font-size:12px" onclick="showVer()"></button></div>
</main>
<nav id="nav"></nav>
<div id="m" hidden></div>
<div id="kp" hidden onpointerdown="event.preventDefault()"><b id="kpv"></b><div class="kg" id="kg"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),K='catatan-keuangan-v1';
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ICON={tunai:'💵',ewallet:'📱',bank:'🏦'};
const blank=t=>({id:uid(),name:t=='biz'?'Usaha':'Pribadi',type:t,wallets:[{id:'w1',name:'Tunai',type:'tunai',init:0},{id:'w2',name:'E-wallet',type:'ewallet',init:0},{id:'w3',name:'Bank',type:'bank',init:0}],tx:[],products:[],staff:[],paid:{},parties:[],savings:[],sales:[],buys:[],orders:[]});
const legacy=o=>[['personal','Pribadi'],['biz','Bisnis']].filter(x=>o[x[0]]).map(x=>Object.assign(blank(x[0]),o[x[0]],{name:x[1]}));
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(S&&S.personal&&!S.profiles){S.profiles=legacy(S);delete S.personal;delete S.biz}
if(!S||!S.profiles)S={tab:'home',cur:null,ym:today().slice(0,7),profiles:[]};
fix();
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let CFG={u:'',t:''},pushT=null,pushing=false;
try{CFG=JSON.parse(localStorage.getItem(K+'-cfg'))||CFG}catch(e){}
const dataStr=()=>JSON.stringify(S.profiles);
let lastData=dataStr();
function save(){
  const ds=dataStr();
  if(ds!==lastData){lastData=ds;S.updated=Date.now();if(CFG.u)queuePush()}
  persist();
}
function stat(t){const e=$('#st');if(e)e.textContent=t}
function queuePush(){clearTimeout(pushT);stat('Menyimpan…');pushT=setTimeout(push,1200)}
async function api(body){
  const r=body?await fetch(CFG.u,{method:'POST',body:JSON.stringify(Object.assign({token:CFG.t},body))})
    :await fetch(CFG.u+(CFG.u.includes('?')?'&':'?')+'token='+encodeURIComponent(CFG.t));
  return r.json();
}
async function push(){
  if(!CFG.u)return;
  if(pushing){queuePush();return}
  pushing=true;const up=S.updated;
  try{
    const r=await api({state:{profiles:S.profiles,updated:up}});
    if(r.ok){S.pushed=up;persist();stat('Tersimpan di Google Sheets ✓')}
    else if(r.error=='stale'){pushing=false;await pull()}
    else stat(r.error=='token'?'Kode tidak cocok dengan TOKEN di Code.gs':'Gagal menyimpan')
  }catch(e){stat('Offline, akan dicoba lagi')}
  pushing=false;
}
async function pull(){
  if(!CFG.u)return;
  stat('Memuat…');
  try{
    const r=await api();
    if(!r.ok){stat(r.error=='token'?'Kode tidak cocok dengan TOKEN di Code.gs':'Gagal memuat');return}
    const c=r.state;
    if(c&&c.updated>(S.updated||0)){S.profiles=c.profiles||legacy(c);fix();S.updated=c.updated;S.pushed=c.updated;lastData=dataStr();persist();render();stat('Sinkron dengan Google Sheets ✓')}
    else if(!c||(S.updated||0)>c.updated){if(!S.updated)S.updated=Date.now();await push()}
    else stat('Sinkron dengan Google Sheets ✓');
  }catch(e){stat('Offline, memakai data lokal')}
}
function settings(){
  form('Sinkronisasi Google Sheets',[
    {k:'u',l:'URL Web App Apps Script (berakhiran /exec)',v:CFG.u,r:0},
    {k:'t',l:CFG.t?'Kode rahasia (tersimpan & disensor, isi hanya untuk mengganti)':'Kode rahasia (sama dengan TOKEN di Code.gs)',t:'password',r:0,v:''}
  ],d=>{
    const u=d.u.trim();CFG={u,t:u?(d.t.trim()||CFG.t):''};
    try{localStorage.setItem(K+'-cfg',JSON.stringify(CFG))}catch(e){}
    stat(CFG.u?'Memuat…':'Belum terhubung ke Google Sheets');
    if(CFG.u)setTimeout(pull,0);
  });
  const t=$('#m [name=t]');
  if(t){const c=document.createElement('label');c.className='mu';c.innerHTML=`<input type="checkbox" style="width:auto;margin-right:6px" onchange="this.closest('form').t.type=this.checked?'text':'password'">Tampilkan ketikan`;t.parentNode.after(c)}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState=='visible')pull();
  else if(pushT){clearTimeout(pushT);pushT=null;push()}
});
const D=()=>S.profiles.find(p=>p.id==S.cur);
const balOf=(d,w)=>w.init+d.tx.filter(x=>x.w==w.id).reduce((s,x)=>s+(x.t=='in'?x.a:-x.a),0);
const cn=x=>!x.tf||x.fee||x.cnt;
const sm=(a,t)=>a.filter(x=>x.t==t&&cn(x)).reduce((s,x)=>s+x.a,0);
let CAN_DL=true;
const bal=w=>w.init+D().tx.filter(x=>x.w==w.id).reduce((s,x)=>s+(x.t=='in'?x.a:-x.a),0);
const wopts=()=>D().wallets.map(w=>[w.id,w.name]);
const wname=id=>(D().wallets.find(w=>w.id==id)||{name:'?'}).name;
const closeM=()=>{$('#m').hidden=true;kpClose()};

function form(title,fields,ok){
  const m=$('#m');
  m.innerHTML=`<div class="sh"><h3>${title}</h3><form>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t=='calc'?'text':f.t||'text'}" value="${esc(f.v==null?'':f.v)}" ${f.t=='number'?'min="0" step="any" inputmode="decimal"':f.t=='datetime-local'?'step="1"':''} ${f.t=='calc'?'inputmode="none" data-calc="1" onfocus="kpOpen(this)" autocomplete="off"':''} ${f.dl?'list="dl_'+f.k+'"':''} ${f.t=='password'?'autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"':''} ${f.r===0?'':'required'}>${f.dl?`<datalist id="dl_${f.k}">${f.dl.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`:''}`}</label>`).join('')}<div class="row"><button type="button" class="g" onclick="closeM()">Batal</button><button class="p">Simpan</button></div></form></div>`;
  m.hidden=false;
  m.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(ok(d)===false)return;closeM();save();render()};
}

function addTx(t){
  form(t=='in'?'Catat pemasukan':'Catat pengeluaran',[
    {k:'a',l:'Jumlah (Rp)',t:'number'},{k:'w',l:t=='in'?'Masuk ke':'Dibayar dari',o:wopts()},
    {k:'c',l:'Kategori (ketik atau pilih)',v:'',dl:cats(t)},{k:'n',l:'Catatan',r:0},{k:'d',l:'Waktu',t:'datetime-local',v:now()}
  ],d=>{D().tx.push({id:uid(),d:d.d,t,a:+d.a,w:d.w,c:d.c,n:d.n})});
}
const VER='4.0';
const CHANGES=[
['4.0','Tab Pemesanan (dengan kotak sudah bayar dan pesan item saja, bisa dijadikan faktur, pengingat di bawah dompet). Restock multi-item dengan diskon, pajak, dan biaya tambahan. Kalkulator di keyboard saat mencatat. Peringatan stok menipis per barang dan bisa ditutup. Faktur dan riwayat di Pihak disatukan. Barang stok kosong di bawah.'],
['3.3','Stok desimal dirapikan (tidak ada lagi 3e-16 atau 0,30000000000000001). Tombol Riwayat di tiap barang menampilkan siapa saja yang bertransaksi. Nomor versi tampil di aplikasi.'],
['3.2','Kode rahasia bisa dilihat saat diketik (Tampilkan ketikan); huruf pertama tidak lagi otomatis kapital.'],
['3.1','Harga jual bisa dipilih per satuan utama atau satuan kedua; harga beli selalu per satuan utama.'],
['3.0','Catatan penjualan multi-item di Pihak bisnis, satuan ukur produk, jenis pihak Terima/Bayar, notifikasi stok menipis, cari transaksi per kategori, kode rahasia disensor.'],
['2.0','Banyak profil, animasi, edit transaksi/stok/staf, Pihak (utang-piutang), Analisis, Tabungan.'],
['1.2','Sinkronisasi otomatis ke Google Sheets.'],
['1.1','Transfer antar dompet dan ekspor Excel.'],
['1.0','Versi awal: mode pribadi dan bisnis, dompet, stok, gaji staf.']];
function showVer(){const m=$('#m');m.innerHTML=`<div class="sh"><h3>Versi ${VER}</h3>${CHANGES.map(c=>`<div class="card"><b>v${c[0]}</b><br><small>${esc(c[1])}</small></div>`).join('')}<div class="row"><button class="g" onclick="closeM()">Tutup</button></div></div>`;m.hidden=false}
function prodHist(pid){
  const d=D(),p=d.products.find(x=>x.id==pid);if(!p)return;
  const u=esc(p.unit||'pcs'),pn=id=>(d.parties.find(x=>x.id==id)||{name:'Pembeli umum'}).name,sn=id=>(d.staff.find(x=>x.id==id)||{name:''}).name,rows=[],by={};
  const add=(k,q)=>{const b=by[k]||(by[k]={q:0,n:0});b.q+=q;b.n++};
  d.sales.forEach(v=>v.items.filter(i=>i.p==pid).forEach(i=>{const nm=pn(v.party);add(nm,i.qb);rows.push({d:v.d,h:`Faktur #${esc(v.no)} · ${esc(nm)}`,s:`-${fmtN(i.q)} ${esc(i.u)}${v.s?' · staf '+esc(sn(v.s)):''}`,oc:`openInv('${v.id}')`})}));
  d.tx.forEach(x=>{
    if(x.sale&&x.sale.p==pid){add('Penjualan lama',x.sale.q);rows.push({d:x.d,h:'Penjualan (lama)',s:`-${fmtN(x.sale.q)} ${u}${x.s?' · staf '+esc(sn(x.s)):''}`,oc:`editTx('${x.id}')`})}
    if(x.restock&&x.restock.p==pid)rows.push({d:x.d,h:'Restock',s:`+${fmtN(x.restock.q)} ${u} · ${rp(x.a)}`,oc:`editTx('${x.id}')`});
  });
  const m=$('#m');
  m.innerHTML=`<div class="sh"><h3>${esc(p.name)}</h3><small>Stok sekarang ${fmtN(p.stock)} ${u}</small><h3>Pembeli</h3>${Object.entries(by).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>`<div class="card li"><b>${esc(k)}</b><small>${v.n}x · ${fmtN(v.q)} ${u}</small></div>`).join('')||'<p class="mu">Belum ada penjualan.</p>'}<h3>Riwayat transaksi</h3>${rows.concat(buyRows(d,pid,u)).sort((a,b)=>b.d.localeCompare(a.d)).map(r=>`<div class="card li tap" onclick="closeM();${r.oc}"><div><b>${r.h}</b><br><small>${r.d.replace('T',' ')} · ${r.s}</small></div></div>`).join('')||'<p class="mu">Belum ada transaksi.</p>'}<div class="row"><button class="g" onclick="closeM()">Tutup</button></div></div>`;
  m.hidden=false;
}
const sale=()=>newInv('');
function restock(pid){newInv('','buy');if(pid)itemDlg(pid,-1)}
const UNITS=['Pcs','Bungkus','Pak','Kotak','Kemasan','Botol','Kaleng','Kg','Gram','Liter','Lusin','Dus','Karung'];
function pForm(p,ok){
  form(p?'Ubah barang':'Tambah barang',[{k:'n',l:'Nama barang',v:p?p.name:''},{k:'ct',l:'Kategori',r:0,v:p?p.cat:''},{k:'u',l:'Satuan utama (mis. Bungkus)',v:p?p.unit:'Pcs',dl:UNITS},{k:'u2',l:'Satuan kedua (opsional, lebih kecil)',r:0,v:p?p.unit2:'',dl:UNITS},{k:'cv',l:'Nilai konversi: 1 satuan utama = … satuan kedua',t:'number',r:0,v:p&&p.unit2?p.conv:''},{k:'pr',l:'Harga jual (Rp)',t:'number',v:p?(p.psel==2&&p.price2!=null?p.price2:p.price):''},{k:'pu',l:'Harga jual di atas adalah per…',o:[['1','Satuan utama'],['2','Satuan kedua']],v:p&&p.psel==2?'2':'1'},{k:'c',l:'Harga beli per satuan utama (Rp)',t:'number',v:p?p.cost:0},{k:'s',l:'Stok (dalam satuan utama)',t:'number',v:p?p.stock:0},{k:'mn',l:'Beri notifikasi saat stok tinggal ≤',t:'number',v:p?mn(p):5}],d=>{
    if(d.u2&&!(+d.cv>0)){alert('Isi nilai konversi untuk satuan kedua.');return false}
    if(d.pu=='2'&&!d.u2){alert('Isi satuan kedua dulu, atau pilih harga jual per satuan utama.');return false}
    const cv=+d.cv||1,pr=+d.pr,c2=d.pu=='2'&&d.u2;
    ok({name:d.n,cat:d.ct,unit:d.u,unit2:d.u2,conv:cv,price:c2?pr*cv:pr,price2:d.u2?(c2?pr:Math.round(pr/cv*100)/100):null,psel:c2?2:1,cost:+d.c,stock:rnd(+d.s),min:+d.mn});
  });
}
function addP(){pForm(null,o=>D().products.push(Object.assign({id:uid()},o)))}
function addS(){form('Tambah staf',[{k:'n',l:'Nama staf'},{k:'b',l:'Gaji pokok per bulan (Rp)',t:'number',v:0},{k:'p',l:'Komisi dari penjualan (%)',t:'number',v:5}],d=>{D().staff.push({id:uid(),name:d.n,base:+d.b,pct:+d.p})})}
function transfer(){
  const d0=D();
  if(d0.wallets.length<2)return alert('Butuh minimal 2 dompet.');
  form('Transfer antar dompet',[{k:'f',l:'Dari',o:wopts()},{k:'t',l:'Ke',o:wopts()},{k:'a',l:'Jumlah (Rp)',t:'number'},{k:'b',l:'Biaya admin (Rp)',t:'number',v:0},{k:'d',l:'Waktu',t:'datetime-local',v:now()}],d=>{
    if(d.f==d.t){alert('Dompet asal dan tujuan harus berbeda.');return false}
    const tf=uid(),a=+d.a,b=+d.b||0;
    d0.tx.push({id:uid(),d:d.d,t:'out',a,w:d.f,c:'Transfer',n:'ke '+wname(d.t),tf});
    d0.tx.push({id:uid(),d:d.d,t:'in',a,w:d.t,c:'Transfer',n:'dari '+wname(d.f),tf});
    if(b>0)d0.tx.push({id:uid(),d:d.d,t:'out',a:b,w:d.f,c:'Biaya admin',n:'transfer ke '+wname(d.t),tf,fee:true});
  });
}
async function exportXls(){
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(!window.XLSX)return alert('Ekspor tidak tersedia.');

function revInv(d,v){const sg=v.kind=='buy'?-1:1;v.items.forEach(i=>{const p=d.products.find(p=>p.id==i.p);if(p)p.stock=rnd(p.stock+sg*i.qb)});d.tx=d.tx.filter(t=>t.inv!=v.id);d.parties.forEach(p=>p.ent=p.ent.filter(e=>e.inv!=v.id))}
function saveInv(){
  const d=D(),x=DR,k=x.kind;
  if(!x.items.length)return alert('Tambahkan minimal satu item.');
  if(k=='order')return saveOrd();
  const buy=k=='buy',L=buy?d.buys:d.sales,T=invT(x),pv=pdv(x),need={},old=x.id&&L.find(v=>v.id==x.id);
  x.items.forEach(i=>need[i.p]=(need[i.p]||0)+i.qb);
  for(const kk in need){
    const p=d.products.find(p=>p.id==kk);if(!p)continue;
    const back=old?old.items.filter(i=>i.p==kk).reduce((a,i)=>a+i.qb,0):0,after=buy?rnd(p.stock-back+need[kk]):rnd(p.stock+back-need[kk]);
    if(after<0)return alert(buy?`Stok ${p.name} akan menjadi negatif.`:`Stok ${p.name} tidak cukup (sisa ${fmtN(p.stock+back)} ${p.unit||'pcs'}).`);
  }
  if(old)revInv(d,old);
  const v=Object.assign(old||{id:uid()},{no:x.no,d:x.d,party:x.party,items:x.items,disc:x.disc,tax:x.tax,fee:x.fee,total:T.total,paid:pv,w:x.w,note:x.note});
  if(buy)v.kind='buy';else{const s=d.staff.find(s=>s.id==x.s);v.s=x.s;v.comm=s?T.total*s.pct/100:0}
  if(!old)L.push(v);
  x.items.forEach(i=>{const p=d.products.find(p=>p.id==i.p);if(!p)return;p.stock=rnd(p.stock+(buy?i.qb:-i.qb));if(buy&&i.qb>0)p.cost=Math.round(i.tot/i.qb*100)/100});
  const pt=d.parties.find(p=>p.id==x.party),lb=(buy?'Restock #':'Faktur #')+x.no;
  if(pv>0)d.tx.push({id:uid(),d:x.d,t:buy?'out':'in',a:pv,w:x.w,c:buy?'Restock':'Penjualan',n:lb+(pt?' · '+pt.name:''),inv:v.id});
  if(pt&&T.total-pv>0)pt.ent.push({id:uid(),k:buy?'b':'y',a:T.total-pv,d:x.d,n:lb,inv:v.id});
  if(x.from)d.orders=d.orders.filter(o=>o.id!=x.from);
  const low=buy?[]:[...new Set(x.items.map(i=>d.products.find(p=>p.id==i.p)).filter(p=>p&&p.stock<=mn(p)))];
  low.forEach(p=>DIS.delete(p.id));
  DR=null;S.sub=null;save();render();
  if(low.length)toast('⚠ Stok menipis: '+low.map(p=>`${p.name} (${fmtN(p.stock)} ${p.unit||'pcs'})`).join(', '));
}

}
function svForm(id){
  const s=id&&D().savings.find(x=>x.id==id);
  form(s?'Ubah tabungan':'Tabungan baru',[{k:'n',l:'Nama tabungan',v:s?s.name:''},{k:'t',l:'Target (Rp)',t:'number',v:s?s.target:''},{k:'p',l:'Rencana pengisian',o:[['harian','Harian'],['mingguan','Mingguan'],['bulanan','Bulanan']],v:s?s.plan:'harian'},{k:'a',l:'Nominal pengisian (Rp)',t:'number',v:s?s.amt:''}],d=>{
    if(!(+d.t>0)){alert('Target harus lebih dari 0');return false}
    const o={name:d.n,target:+d.t,plan:d.p,amt:+d.a};
    if(s)Object.assign(s,o);else D().savings.push(Object.assign({id:uid(),created:today(),log:[]},o));
  });
}
function logForm(sid,lid){
  const s=D().savings.find(x=>x.id==sid),l=lid&&s.log.find(x=>x.id==lid),rm=Math.max(0,s.target-svSum(s));
  form(l?'Ubah catatan':'Catat tabungan',[{k:'k',l:'Jenis',o:[['+','Tambah'],['-','Kurangi']],v:l&&l.a<0?'-':'+'},{k:'a',l:'Nominal (Rp)',t:'number',v:l?Math.abs(l.a):''},{k:'n',l:'Keterangan',r:0,v:l?l.n:''},{k:'d',l:'Waktu',t:'datetime-local',v:l?l.d:now()}],d=>{
    const o={a:(d.k=='-'?-1:1)*+d.a,n:d.n,d:d.d};
    if(l)Object.assign(l,o);else s.log.push(Object.assign({id:uid()},o));
  });
  const c=document.createElement('div');c.className='chips';
  c.innerHTML=[s.amt,rm].filter(v=>v>0).map(v=>`<button type="button" class="g" onclick="this.closest('form').a.value=${Math.round(v)}">${rp(v)}</button>`).join('');
  $('#m [name=a]').parentNode.after(c);
}
function delSv(id){if(confirm('Hapus tabungan ini?')){D().savings=D().savings.filter(x=>x.id!=id);S.sub=null;save();render()}}
function delLog(sid,lid){if(confirm('Hapus catatan ini?')){const s=D().savings.find(x=>x.id==sid);s.log=s.log.filter(l=>l.id!=lid);save();render()}}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,.tap');if(!t)return;const b=t.getBoundingClientRect(),z=Math.max(b.width,b.height)*2,i=document.createElement('i');i.className='rp';i.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-b.left-z/2}px;top:${e.clientY-b.top-z/2}px`;t.appendChild(i);setTimeout(()=>i.remove(),500)});
function addW(){form('Tambah dompet',[{k:'n',l:'Nama (mis. GoPay, BCA)'},{k:'t',l:'Jenis',o:[['tunai','Tunai'],['ewallet','E-wallet'],['bank','Bank']]},{k:'i',l:'Saldo awal (Rp)',t:'number',v:0}],d=>{D().wallets.push({id:uid(),name:d.n,type:d.t,init:+d.i})})}
function editW(id){const w=D().wallets.find(x=>x.id==id);form('Ubah dompet',[{k:'n',l:'Nama',v:w.name},{k:'i',l:'Saldo awal (Rp)',t:'number',v:w.init}],d=>{w.name=d.n;w.init=+d.i})}
function delTx(id){
  const d=D(),x=d.tx.find(t=>t.id==id);if(x&&x.inv)return delInv(x.inv);if(!x||!confirm('Hapus transaksi ini?'))return;
  if(x.tf){if(x.pt){const p=d.parties.find(p=>p.id==x.pt);if(p)p.ent=p.ent.filter(e=>e.id!=x.tf)}d.tx=d.tx.filter(t=>t.tf!=x.tf);save();render();return}
  if(x.sale){const p=d.products.find(p=>p.id==x.sale.p);if(p)p.stock+=x.sale.q}
  if(x.restock){const p=d.products.find(p=>p.id==x.restock.p);if(p)p.stock-=x.restock.q}
  d.tx=d.tx.filter(t=>t.id!=id);save();render();
}
function delP(id){if(confirm('Hapus barang ini?')){D().products=D().products.filter(p=>p.id!=id);save();render()}}
function delS(id){if(confirm('Hapus staf ini?')){D().staff=D().staff.filter(s=>s.id!=id);save();render()}}
function pay(id){
  const d0=D(),s=d0.staff.find(x=>x.id==id),ym=S.ym;
  const cm=sc(d0,id,ym).comm,tot=s.base+cm;
  form(`Bayar gaji ${esc(s.name)} (${rp(tot)})`,[{k:'w',l:'Dibayar dari',o:wopts()}],d=>{
    d0.tx.push({id:uid(),d:now(),t:'out',a:tot,w:d.w,c:'Gaji',n:`${s.name} ${ym}`});d0.paid[id+ym]=true;
  });
}

function home(d,b,ym){
  const m=d.tx.filter(x=>x.d.startsWith(ym)),tot=d.wallets.reduce((a,w)=>a+bal(w),0);
  const low=b?d.products.filter(p=>p.stock<=mn(p)):[];
  return `<div class="hero"><small>Total saldo</small><h1>${rp(tot)}</h1></div>
  <div class="row2"><div class="card"><small>Pemasukan bulan ini</small><b class="in">${rp(sm(m,'in'))}</b></div><div class="card"><small>Pengeluaran bulan ini</small><b class="out">${rp(sm(m,'out'))}</b></div></div>
  <div class="acts"><button class="p" onclick="addTx('in')">+ Pemasukan</button><button class="p" onclick="addTx('out')">+ Pengeluaran</button><button class="p" onclick="transfer()">Transfer</button>${b?'<button class="p" onclick="sale()">Catat penjualan</button><button class="p" onclick="restock()">Restock</button>':''}</div>
  ${low.filter(p=>!DIS.has(p.id)).map(p=>`<div class="card warn li"><span>⚠ ${esc(p.name)} tinggal ${fmtN(p.stock)} ${esc(p.unit||'pcs')}</span><button class="x" onclick="DIS.add('${p.id}');render()" aria-label="Tutup">×</button></div>`).join('')}
  <h3>Dompet</h3>${d.wallets.map(w=>`<div class="card li" onclick="editW('${w.id}')"><span>${ICON[w.type]} ${esc(w.name)}</span><b>${rp(bal(w))}</b></div>`).join('')}
  <button class="g" onclick="addW()">+ Tambah dompet</button>${CAN_DL?'<button class="g" style="margin-left:8px" onclick="exportXls()">Ekspor ke Excel</button>':''}${ordBox(d,b)}`;
}
function tl(d){
  const q=(S.tq||'').toLowerCase().trim(),l=[...d.tx].filter(x=>!q||(x.c||'').toLowerCase().includes(q)||(x.n||'').toLowerCase().includes(q)).sort((a,b)=>b.d.localeCompare(a.d));
  const i=l.filter(x=>x.t=='in'&&cn(x)).reduce((s,x)=>s+x.a,0),o=l.filter(x=>x.t=='out'&&cn(x)).reduce((s,x)=>s+x.a,0);
  return (q?`<div class="row2"><div class="card"><small>Masuk (${l.length} transaksi)</small><b class="in">${rp(i)}</b></div><div class="card"><small>Keluar</small><b class="out">${rp(o)}</b></div></div>`:'')+(l.slice(0,200).map(x=>`<div class="card li tap" onclick="editTx('${x.id}')"><div><b>${esc(x.c)}</b>${x.n?' · '+esc(x.n):''}<br><small>${x.d.replace('T',' ')} · ${esc(wname(x.w))}</small></div><div style="text-align:right"><b class="${x.t}">${x.t=='in'?'+':'-'}${rp(x.a)}</b><br><button class="x" onclick="event.stopPropagation();delTx('${x.id}')" aria-label="Hapus">×</button></div></div>`).join('')||'<p class="mu">Tidak ada transaksi.</p>');
}
function txv(d){
  const cs=[...new Set(d.tx.map(x=>x.c).filter(Boolean))];
  return `<h3>Transaksi</h3><input list="dlq" placeholder="Cari kategori atau catatan…" value="${esc(S.tq||'')}" oninput="S.tq=this.value;$('#tl').innerHTML=tl(D())"><datalist id="dlq">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div id="tl">${tl(d)}</div>`;
}
function stok(d){
  return `<h3>Stok barang</h3>${[...d.products].sort((a,b)=>(a.stock<=0)-(b.stock<=0)).map(p=>`<div class="card"><div class="li"><b>${esc(p.name)}</b><span><button class="x" onclick="editP('${p.id}')">✎</button><button class="x" onclick="delP('${p.id}')" aria-label="Hapus">×</button></span></div>
  <div class="li"><span class="${p.stock<=mn(p)?'out':''}">Stok: <b>${fmtN(p.stock)} ${esc(p.unit||'pcs')}</b></span><span>Jual ${rp(p.price)}/${esc(p.unit||'pcs')}${p.unit2?' · '+rp(uprice(p,p.unit2))+'/'+esc(p.unit2):''}</span></div>
  <div class="li"><small>Nilai stok ${rp(p.stock*p.cost)}</small><small>Notif ≤ ${mn(p)} · Beli ${rp(p.cost)}</small></div>
  <button class="g" onclick="restock('${p.id}')">Restock</button> <button class="g" onclick="prodHist('${p.id}')">Riwayat</button></div>`).join('')||'<p class="mu">Belum ada barang. Tambahkan barang pertama.</p>'}
  <button class="p" onclick="addP()">+ Tambah barang</button>`;
}
function staf(d,b,ym){
  return `<h3>Gaji staf · ${ym}</h3>${d.staff.map(s=>{
    const {sales,comm:cm}=sc(d,s.id,ym);
    return `<div class="card"><div class="li"><b>${esc(s.name)}</b><span><button class="x" onclick="editS('${s.id}')">✎</button><button class="x" onclick="delS('${s.id}')" aria-label="Hapus">×</button></span></div>
    <small>Gaji pokok ${rp(s.base)}, komisi ${s.pct}%</small>
    <div class="li"><span>Penjualan</span><span>${rp(sales)}</span></div><div class="li"><span>Komisi</span><span>${rp(cm)}</span></div>
    <div class="li t"><span>Total gaji</span><b>${rp(s.base+cm)}</b></div>
    ${d.paid[s.id+ym]?'<small class="in">Sudah dibayar</small>':`<button class="p" onclick="pay('${s.id}')">Bayar gaji</button>`}</div>`}).join('')||'<p class="mu">Belum ada staf. Tambahkan staf agar komisi dihitung dari penjualan.</p>'}
  <button class="g" onclick="addS()">+ Tambah staf</button>`;
}
function render(){
  $('#vb').textContent='Versi '+VER+' · riwayat pembaruan';kpClose();
  const d=S.cur&&D();
  if(S.cur&&!d)S.cur=null;
  if(S.sub&&S.sub.k=='inv'&&!DR)S.sub=null;
  $('#bk').hidden=!S.cur;
  if(!S.cur){$('#ttl').textContent='Catatan Keuangan';$('#ym').hidden=true;$('#nav').innerHTML='';$('#v').innerHTML=profs();return}
  const b=d.type=='biz',tabs=[['home','Beranda'],['tx','Transaksi'],...(b?[['ord','Pemesanan']]:[]),['pt','Pihak'],...(b?[['stok','Stok'],['staf','Staf']]:[]),['ana','Analisis'],...(b?[]:[['sv','Tabungan']])];
  if(!tabs.some(t=>t[0]==S.tab))S.tab='home';
  $('#ttl').textContent=(b?'🏪 ':'👤 ')+d.name;
  $('#ym').hidden=!!S.sub||!['home','ana','staf'].includes(S.tab);$('#ym').value=S.ym;
  $('#nav').innerHTML=tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';S.sub=null;save();render()">${t[1]}</button>`).join('');
  $('#nav').style.display=S.sub&&S.sub.k=='inv'?'none':'';
  $('#v').innerHTML=S.sub?(S.sub.k=='inv'?invv(d):S.sub.k=='pt'?ptd(d):svd(d)):({home,tx:txv,ord:ordv,pt:pty,stok,staf,ana,sv:svl})[S.tab](d,b,S.ym);
}
render();
stat(CFG.u?'Memuat…':'Belum terhubung ke Google Sheets');pull();
(async()=>{try{if(window.claude&&await claude.use('downloads')){CAN_DL=true;render()}}catch(e){}})();
</script>
</body>
</html>
